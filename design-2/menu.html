<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakura · Menu · Weston-super-Mare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@400;500;700&family=Didact+Gothic&family=Yuji+Boku&family=Noto+Serif+JP:wght@300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/common.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="dark">
<header class="bar">
  <a class="logo" href="index.html" data-logo="54"><span class="sakura-logo" data-kanji style="font-size:27px"></span></a>
  <button class="burger" data-toggle="#nav" aria-label="Menu">☰</button>
  <nav class="caps" id="nav">
    <a href="index.html#about">About Us</a>
    <a href="menu.html" class="active">Menu</a>
    <a href="index.html#visit">Book a Table</a>
    <a href="index.html#gallery">Gallery</a>
    <a href="index.html#visit">Contact</a>
  </nav>
</header>

<section class="mhero">
  <div data-img="grill"></div>
  <h1>Menu</h1>
  <div class="petals" data-count="10"></div>
</section>

<div class="has-orn" style="overflow:hidden">
  <div class="orn" data-orn="wave" data-ink="rgba(255,255,255,.045)" data-size="56" style="inset:0;z-index:0"></div>
  <div class="orn hide-sm" data-orn="branch" data-ink="#9b8580" style="width:400px;height:200px;right:-60px;top:10px"></div>
  <div class="orn hide-sm" data-orn="branch" data-flip data-ink="#9b8580" style="width:400px;height:200px;left:-60px;bottom:120px"></div>
  <main class="menu-body" id="menu"></main>
</div>
<div class="wave-band" data-orn="wave" data-ink="#c8202f" data-fill="#121010" style="background-color:#121010"></div>

<p style="text-align:center;color:#999;font-size:14px;letter-spacing:.06em;line-height:1.9;margin:0;padding:0 20px 60px">Book or order for collection: <strong style="color:#fff">01934 418388</strong><br>Please tell us about any allergies when you order.</p>
<footer class="foot">
  <span class="mon"></span>
  Sakura · Japanese Restaurant · Weston-super-Mare
</footer>
<p class="credit dark-credit">Created by Yvis Hausen</p>
<script src="../assets/menu-data.js"></script>
<script>
document.getElementById("menu").innerHTML = SAKURA_MENU.map(function (s) {
  return '<section class="msec"><h2>' + s.title + '</h2><div class="jp">' + s.jp + '</div>' +
    (s.note ? '<p class="note">' + s.note + '</p>' : '') +
    '<div class="items">' + s.items.map(function (it) {
      return '<div class="mi"><span class="n">' + it.name + (it.v ? ' <small class="vv">' + it.v + '</small>' : '') + '</span><span class="p">£' + it.price +
        '</span><span class="d">' + it.desc + '</span></div>';
    }).join('') + '</div></section>';
}).join('');
</script>
<script src="../assets/common.js"></script>
<script src="../assets/brand.js"></script>
<script src="../assets/ornaments.js"></script>
</body>
</html>
