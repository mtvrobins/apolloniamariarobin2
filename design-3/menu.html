<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sakura · Menu · Weston-super-Mare</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600&family=Russo+One&family=Cormorant+Garamond:ital,wght@1,600&family=Noto+Serif&family=Yuji+Boku&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/common.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="head">
  <a class="brand" href="index.html" data-logo="90">
    <span class="mon"></span>
    <span>
      <span class="wm"><span class="sakura-kanji" style="margin-right:.25em;vertical-align:-.08em">桜</span>S<i>A</i>KUR<i>A</i></span>
      <span class="t">Japanese Restaurant</span>
    </span>
  </a>
  <nav class="plain">
    <a href="index.html">Home</a>
    <a href="index.html#about">About Us</a>
    <a href="menu.html" class="active">Menu</a>
    <a href="index.html#visit">Book a Table</a>
  </nav>
</header>

<section class="mtitle">
  <span class="mon" data-fill="#ffffff" data-line="#7d1d2b"></span>
  <div class="orn" data-orn="wave" data-ink="rgba(255,255,255,.1)" data-size="56" style="inset:0;z-index:0"></div>
  <div class="petals" data-count="10"></div>
  <h1 style="position:relative;z-index:2">Our Menu</h1>
  <p>Sushi · Sashimi · Tempura · Donburi</p>
</section>

<section class="mbody has-orn" style="overflow:hidden">
  <div class="orn hide-sm" data-orn="branch" data-flip style="width:420px;height:210px;left:-70px;top:-10px;opacity:.9"></div>
  <div class="orn hide-sm" data-orn="branch" style="width:420px;height:210px;right:-70px;bottom:40px;opacity:.9"></div>
  <div class="mgrid" id="menu"></div>
  <div class="photos">
    <div data-img="uni"></div>
    <div data-img="toro"></div>
    <div data-img="hero"></div>
  </div>
</section>

<div class="wave-band" data-orn="wave" data-ink="#7d1d2b" data-fill="#2a0f16" style="background-color:#2a0f16"></div>
<footer class="foot">
  Book or order for collection: 01934 418388 · Please tell us about any allergies<br>
  36 Boulevard, Weston-super-Mare BS23 1NF
</footer>
<p class="credit foot-credit">Created by Yvis Hausen</p>
<script src="../assets/menu-data.js"></script>
<script>
document.getElementById("menu").innerHTML = SAKURA_MENU.map(function (s) {
  return '<div class="card"><span class="ic">' + (s.jp.length <= 2 ? s.jp : '<span class="sakura-kanji">桜</span>') + '</span><h2>' + s.title + '</h2>' +
    (s.note ? '<p class="note">' + s.note + '</p>' : '') +
    s.items.map(function (it) {
      return '<div class="mi"><div class="row"><span>' + it.name + (it.v ? ' <small class="vv">' + it.v + '</small>' : '') + '</span><span class="p">£' + it.price +
        '</span></div><p>' + it.desc + '</p></div>';
    }).join('') + '</div>';
}).join('');
</script>
<script src="../assets/common.js"></script>
<script src="../assets/ornaments.js"></script>
</body>
</html>
