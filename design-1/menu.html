<script src="../assets/menu-data.js"></script>
<script>
document.getElementById("menu").innerHTML = SAKURA_MENU.map(function (s) {
  return '<div class="msec"><h2>' + s.title + '<span>' + s.jp + '</span></h2>' +
    (s.note ? '<p class="note">' + s.note + '</p>' : '') +
    s.items.map(function (it) {
      return '<div class="mi"><div class="row"><span>' + it.name + (it.jp ? '<span class="jp">' + it.jp + '</span>' : '') +
        '</span><span>' + it.price + '</span></div><p>' + it.desc + '</p></div>';
    }).join('') + '</div>';
}).join('');
</script>
<script src="../assets/common.js"></script>
